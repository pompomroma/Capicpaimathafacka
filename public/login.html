<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Friday — sign in</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth">
  <main id="auth-card">
    <h1>F·R·I·D·A·Y</h1>
    <p class="muted">authorize to continue</p>
    <form id="auth-form">
      <label>email<input id="email" type="email" required autocomplete="email" /></label>
      <label>passcode<input id="password" type="password" minlength="6" required autocomplete="current-password" /></label>
      <div class="row">
        <button id="login-btn" type="submit" class="btn primary">sign in</button>
        <button id="register-btn" type="button" class="btn">register</button>
      </div>
      <div id="auth-error" class="error" hidden></div>
    </form>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
